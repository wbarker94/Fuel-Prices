<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TravelCenters of America · Fuel Prices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0066AA;      /* TA blue */
    --red:#EE3124;       /* TA red */
    --navy:#004E84;      /* deeper TA blue for depth */
    --text:#FFFFFF;
    --muted:#D3E5F3;     /* light text on blue */
    --ink:#14212E;       /* text on white signs */
    --ink-muted:#5B6773;
    --up:#C4261D;        /* price rose */
    --down:#1A8A4A;      /* price fell */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}

  .widget{
    container-type:inline-size;
    width:856px;height:559px;max-width:100%;margin:0 auto;
    background:linear-gradient(180deg,var(--blue) 0%,var(--navy) 100%);border-radius:14px;overflow:hidden;
    border-top:5px solid var(--red);
  }
  .inner{padding:clamp(14px,4cqi,30px) clamp(14px,4.5cqi,34px)}

  /* Header */
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  /* Logo slot: replace .wordmark with <img class="logo" src="..."> when the logo is supplied */
  .wordmark{font-weight:600;font-size:clamp(13px,2.3cqi,17px);line-height:1.15;letter-spacing:.01em}
  .badge{background:#FFFFFF;border-radius:8px;padding:clamp(5px,1.1cqi,8px);display:inline-flex;line-height:0}
  .logo{height:clamp(46px,10cqi,72px);width:auto;display:block}
  .tag{font-size:clamp(11px,1.8cqi,14px);color:var(--muted);text-align:right;white-space:nowrap;font-weight:600}

  h1{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;
     font-size:clamp(24px,6cqi,44px);line-height:1;letter-spacing:.01em;text-transform:uppercase;
     margin-top:clamp(12px,3cqi,20px)}
  .lane{height:3px;margin:clamp(10px,2.4cqi,16px) 0 clamp(14px,3cqi,22px);
        background:repeating-linear-gradient(90deg,#FFFFFF 0 26px,transparent 26px 44px);opacity:.85}

  /* Price signs */
  .signs{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(8px,1.6cqi,12px)}
  .sign{background:#FFFFFF;border:1px solid #FFFFFF;border-radius:10px;color:var(--ink);
        padding:clamp(10px,2cqi,14px);display:flex;flex-direction:column;min-width:0}
  .fuel{display:inline-block;align-self:flex-start;font-family:"Barlow Condensed","Arial Narrow",sans-serif;
        font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(12px,2cqi,15px);
        padding:3px 9px;border-radius:4px;background:var(--blue);color:#FFFFFF}
  .diesel .fuel{background:var(--red)}
  .price{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;line-height:.95;
         font-variant-numeric:tabular-nums;margin-top:clamp(6px,1.2cqi,8px);white-space:nowrap}
  .diesel .price{color:var(--red);font-size:clamp(36px,8.5cqi,64px)}
  .gas .price{color:var(--blue);font-size:clamp(32px,7cqi,52px)}
  .price .tenth{font-size:.42em;vertical-align:super;margin-left:2px}
  .unit{color:var(--ink-muted);font-size:clamp(11px,1.8cqi,14px);margin-top:2px}
  .change{margin-top:clamp(4px,1cqi,8px);font-weight:600;font-size:clamp(12px,2cqi,15px)}
  .change.up{color:var(--up)} .change.down{color:var(--down)} .change.flat{color:var(--ink-muted)}
  .change span{color:var(--ink-muted);font-weight:400}
  .trend{margin-top:auto;padding-top:clamp(6px,1.4cqi,10px)}
  .trend svg{display:block;width:100%;height:clamp(20px,3.6cqi,30px)}
  .trend-lbl{color:var(--ink-muted);font-size:clamp(10px,1.6cqi,12px);margin-top:4px}

  /* Traffic */
  .traffic{display:flex;align-items:center;gap:clamp(10px,2cqi,16px);
           margin-top:clamp(8px,1.6cqi,12px);padding:clamp(10px,2cqi,14px);
           background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:10px}
  .traffic svg{flex:0 0 auto;width:clamp(30px,5.5cqi,42px);height:auto}
  .t-text{flex:1;min-width:0}
  .t-lbl{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;text-transform:uppercase;
         letter-spacing:.06em;font-size:clamp(12px,1.9cqi,15px)}
  .t-sub{color:var(--muted);font-size:clamp(11px,1.7cqi,13px)}
  .t-count{text-align:right;white-space:nowrap}
  .t-num{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;line-height:1;
         font-size:clamp(28px,6cqi,44px);font-variant-numeric:tabular-nums}
  .t-up{display:inline-block;margin-top:3px;background:var(--red);color:#fff;font-weight:600;
        font-size:clamp(11px,1.6cqi,13px);padding:1px 7px;border-radius:999px}
  .foot{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;
        margin-top:clamp(12px,2.6cqi,18px);color:var(--muted);font-size:clamp(11px,1.7cqi,13px)}
  .foot strong{color:var(--text);font-weight:600}

  .status{padding:clamp(20px,6cqi,40px) 0;text-align:center;color:var(--muted);font-size:clamp(13px,2.2cqi,16px)}

  @container (max-width:520px){
    .signs{grid-template-columns:1fr}
    .tag{display:none}
    .diesel .price{font-size:clamp(38px,15cqi,60px)}
    .gas .price{font-size:clamp(32px,12.5cqi,50px)}
    .traffic{flex-wrap:wrap}
    .t-count{flex-basis:100%;text-align:left;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .t-up{margin-top:0}
    .t-num{font-size:clamp(30px,12cqi,40px)}
    .foot{flex-direction:column}
  }
</style>
</head>
<body>
<section class="widget" id="fuel" aria-labelledby="fuel-title">
  <div class="inner">
    <div class="top">
      <div class="brand"><span class="badge"><img class="logo" alt="TravelCenters of America" src="data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4NCjwhLS0gR2VuZXJhdG9yOiB[...]
      <p class="tag" id="live">● Live pricing</p>
    </div>

    <h1 id="fuel-title">Fuel prices right now</h1>
    <div class="lane" aria-hidden="true"></div>


    <div class="signs">
      <article class="sign diesel" id="sign-diesel">
        <span class="fuel">Diesel</span>
        <div class="price" data-f="price"></div>
        <div class="unit">Per gallon</div>
        <div class="change" data-f="change"></div>
        <div class="trend"><svg viewBox="0 0 200 48" preserveAspectRatio="none" aria-hidden="true"><path data-f="spark" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round" strok[...]
      </article>
      <article class="sign gas" id="sign-gasoline">
        <span class="fuel">Regular gasoline</span>
        <div class="price" data-f="price"></div>
        <div class="unit">Per gallon</div>
        <div class="change" data-f="change"></div>
        <div class="trend"><svg viewBox="0 0 200 48" preserveAspectRatio="none" aria-hidden="true"><path data-f="spark" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stro[...]
      </article>
    </div>

    <div class="traffic">
      <svg viewBox="0 0 48 32" aria-hidden="true"><rect x="2" y="6" width="28" height="18" rx="2" fill="#FFFFFF"/><path d="M30 12h8l6 6v6H30z" fill="#FFFFFF"/><path d="M33 14h4.5l3.5 4H33z" fill="var([...]
      <div class="t-text">
        <div class="t-lbl">Traffic into the travel center</div>
        <div class="t-sub">Vehicles today</div>
      </div>
      <div class="t-count">
        <div class="t-num" id="traffic">—</div>
        <span class="t-up" id="traffic-up">+20</span>
      </div>
    </div>

    <div class="foot">
      <span>Updated <strong id="updated">—</strong></span>
      <span id="next">Next update in — min</span>
    </div>
  </div>
</section>

<script>
(function(){
  // Demo pricing: prices step every 15 minutes, drifting down 25¢ from the
  // baseline and back up again. Based on the clock, so every viewer sees the same price.
  const STEP = 15 * 60 * 1000;          // 15 minutes
  const HALF = 12;                      // 12 steps down (3 hrs), 12 steps up (3 hrs)
  const RANGE = 0.25;                   // dollars
  const FUELS = {
    diesel:   { base: 5.99, phase: 0 },
    gasoline: { base: 4.19, phase: 7 }  // offset so the two don't move in lockstep
  };

  const TRAFFIC_START = 100;   // vehicles at midnight
  const TRAFFIC_STEP  = 20;    // added every 15 minutes

  // small, repeatable wobble so the line isn't perfectly straight
  function wobble(n){ const x = Math.sin(n * 12.9898) * 43758.5453; return (x - Math.floor(x) - .5) * 0.012; }

  function priceAt(fuel, n){
    const k = ((n + fuel.phase) % (HALF * 2) + HALF * 2) % (HALF * 2);
    const depth = k <= HALF ? k / HALF : (2 * HALF - k) / HALF;   // 0 → 1 → 0
    let p = fuel.base - depth * RANGE + (k % HALF ? wobble(n + fuel.phase) : 0);
    p = Math.min(fuel.base, Math.max(fuel.base - RANGE, p));
    return Math.round(p * 100) / 100 + 0.009;                       // pump-style 9/10¢
  }

  function priceHTML(v){
    const s = v.toFixed(3);
    return '$' + s.slice(0,-1) + '<span class="tenth">' + s.slice(-1) + '</span>';
  }

  function spark(vals){
    const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
    return vals.map((v,i) => {
      const x = (i / (vals.length - 1)) * 200;
      const y = 44 - ((v - min) / span) * 40;
      return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join(' ');
  }

  let lastStep = null;

  function render(){
    const now = Date.now(), n = Math.floor(now / STEP);
    const minsLeft = Math.max(1, Math.ceil(((n + 1) * STEP - now) / 60000));
    document.getElementById('next').textContent = 'Next update in ' + minsLeft + ' min';
    if (n === lastStep) return;
    lastStep = n;

    for (const [key, fuel] of Object.entries(FUELS)){
      const el = document.getElementById('sign-' + key);
      const hist = Array.from({length: 12}, (_, i) => priceAt(fuel, n - 11 + i));
      const last = hist[11], prev = hist[10], diff = (last - prev) * 100;
      el.querySelector('[data-f="price"]').innerHTML = priceHTML(last);
      const ch = el.querySelector('[data-f="change"]');
      if (Math.abs(diff) < 0.5){ ch.className = 'change flat'; ch.innerHTML = 'No change <span>since last update</span>'; }
      else {
        const up = diff > 0;
        ch.className = 'change ' + (up ? 'up' : 'down');
        ch.innerHTML = (up ? '▲ ' : '▼ ') + Math.round(Math.abs(diff)) + '¢ <span>since last update</span>';
      }
      el.querySelector('[data-f="spark"]').setAttribute('d', spark(hist));
      el.querySelector('[data-f="trendlbl"]').textContent = 'Last 3 hours';
    }
    // Traffic: starts the day at 100 vehicles and adds 20 every 15 minutes, resetting at midnight.
    const d = new Date(n * STEP), midnight = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const stepsToday = Math.round((n * STEP - midnight) / STEP);
    document.getElementById('traffic').textContent = (TRAFFIC_START + TRAFFIC_STEP * stepsToday).toLocaleString('en-US');
    document.getElementById('traffic-up').textContent = '+' + TRAFFIC_STEP + ' last 15 min';

    document.getElementById('updated').textContent =
      new Date(n * STEP).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
  }

  render();
  setInterval(render, 15 * 1000);   // checks every 15 seconds; prices move every 15 minutes
})();
</script>
</body>
</html>
